<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Site Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: app shell — top bar, section rail (left), editor (centre), live preview (right). Stacks to Edit/Preview tabs on phones. */
:root{
  --bg:#071027; --panel:#0C1A3B; --panel-2:#11234D; --line:#1E3366; --ink:#E9EFFB; --muted:#93A3C6;
  --accent:#4A86FF; --ok:#4FD1A5; --warn:#F2C46D; --bad:#FF7A7A;
  --f:"Hanken Grotesk","Segoe UI",Roboto,Arial,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.top{display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap}
.logo b{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--bg);display:grid;place-items:center;font-size:.7rem}
.pill{font:500 .74rem/1 var(--mono);padding:7px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.dirty{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel-2);padding:9px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:disabled{opacity:.6;cursor:wait}
.btn.small{padding:6px 10px;font-size:.82rem;border-radius:7px}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#200;border-color:var(--bad)}
.icon-btn{border:1px solid transparent;background:none;color:var(--muted);width:30px;height:30px;border-radius:7px;cursor:pointer;display:inline-grid;place-items:center;font-size:.95rem}
.icon-btn:hover{border-color:var(--line);color:var(--ink)}
.shell{display:grid;grid-template-columns:220px minmax(360px,1fr) minmax(380px,1.1fr);min-height:0}
.rail{border-right:1px solid var(--line);overflow:auto;padding:12px 8px;background:var(--panel)}
.rail h6{font:500 .68rem/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 10px 8px}
.rail button{display:flex;width:100%;text-align:left;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;border:0;background:none;cursor:pointer;color:var(--muted);font-weight:500}
.rail button:hover{color:var(--ink);background:var(--panel-2)}
.rail button.on{color:var(--ink);background:var(--panel-2);box-shadow:inset 3px 0 0 var(--accent)}
.rail button i{font-style:normal;font:500 .7rem/1 var(--mono);width:22px;color:var(--accent)}
.editor{overflow:auto;padding:22px clamp(16px,2.5vw,32px) 80px;min-width:0}
.editor h1{font-size:1.5rem;margin:0 0 4px}
.editor .desc{color:var(--muted);margin:0 0 22px;max-width:60ch}
.field{display:grid;gap:6px;margin-bottom:16px}
.field>label,.lbl{font-weight:600;font-size:.88rem;display:flex;justify-content:space-between;gap:8px}
.count{font:500 .72rem/1.6 var(--mono);color:var(--muted)}
.count.over{color:var(--bad)}
.help{font-size:.8rem;color:var(--muted)}
input[type=text],input[type=url],input[type=email],input[type=number],input[type=password],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0}
textarea{resize:vertical;min-height:70px;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.check{display:flex;align-items:center;gap:10px;font-weight:500}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media (max-width:1300px){.grid2{grid-template-columns:1fr}}
.group{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:18px;background:color-mix(in srgb,var(--panel) 60%,transparent)}
.group>.lbl{margin-bottom:10px}
.items{display:grid;gap:10px}
.item{border:1px solid var(--line);border-radius:10px;background:var(--panel);min-width:0}
.item.over{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.item.dragging{opacity:.4}
.item-head{display:flex;align-items:center;gap:4px;padding:6px 6px 6px 4px}
.item-head .title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;font-weight:600;font-size:.9rem;padding:4px}
.handle{cursor:grab;color:var(--muted);width:28px;height:30px;display:grid;place-items:center;border-radius:6px;user-select:none;font-size:1rem;letter-spacing:-2px}
.handle:hover{background:var(--panel-2);color:var(--ink)}
.item-body{padding:4px 14px 12px;border-top:1px solid var(--line)}
.item.collapsed .item-body{display:none}
.str{display:flex;gap:6px;align-items:flex-start}
.str>input,.str>textarea{flex:1}
.add{border:1px dashed var(--line);background:none;border-radius:10px;padding:10px;cursor:pointer;color:var(--muted);font-weight:600;width:100%}
.add:hover{color:var(--ink);border-color:var(--accent)}
.img-field{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start}
.thumb{width:96px;height:96px;border-radius:9px;border:1px solid var(--line);background:var(--bg) center/contain no-repeat;display:grid;place-items:center;color:var(--muted);font-size:.72rem;text-align:center}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--muted);cursor:pointer;font-size:.88rem}
.drop.hot{border-color:var(--accent);color:var(--ink);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.gcard{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden;display:grid;min-width:0}
.gcard.over{border-color:var(--accent)}
.gcard.dragging{opacity:.4}
.gcard .gimg{aspect-ratio:4/5;background:var(--bg) center/contain no-repeat;position:relative;cursor:grab}
.gcard .gimg span{position:absolute;top:6px;left:6px;font:500 .68rem/1 var(--mono);background:rgba(7,16,39,.85);padding:5px 7px;border-radius:6px}
.gcard .gbody{padding:8px;display:grid;gap:6px}
.gcard .gbody input,.gcard .gbody select{padding:6px 8px;font-size:.82rem}
.gcard .gtools{display:flex;justify-content:space-between}
.preview{border-left:1px solid var(--line);display:grid;grid-template-rows:auto 1fr;min-width:0;background:#040a1a}
.pv-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 10px;cursor:pointer;color:var(--muted);font-size:.82rem}
.seg button[aria-pressed=true]{background:var(--panel-2);color:var(--ink)}
.pv-wrap{overflow:hidden;position:relative;padding:0}
.pv-wrap iframe{border:0;background:#081633;display:block;position:absolute;top:0;left:0;width:1280px;transform-origin:0 0}
.pv-wrap.mobile{overflow:auto}
.pv-wrap.mobile iframe{position:static;width:390px;max-width:calc(100% - 32px);height:calc(100% - 32px);margin:16px auto;transform:none!important;border-radius:18px;border:1px solid var(--line)}
.banner{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:12px 14px;margin-bottom:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.banner.bad{border-color:color-mix(in srgb,var(--bad) 55%,transparent)}
.banner.good{border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.banner p{margin:0;flex:1;min-width:200px}
.serp{background:#fff;color:#202124;border-radius:12px;padding:16px 18px;font-family:Arial,sans-serif;margin-bottom:18px}
.serp .u{font-size:13px;color:#4d5156}
.serp .t{font-size:20px;color:#1a0dab;margin:4px 0;line-height:1.3}
.serp .d{font-size:14px;color:#4d5156;line-height:1.55}
.checks{list-style:none;padding:0;margin:0 0 20px;display:grid;gap:6px}
.checks li{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.checks li b{font:500 .72rem/1.9 var(--mono);width:34px;flex:none}
.checks .y b{color:var(--ok)}.checks .n b{color:var(--warn)}
.score{font:700 2.2rem/1 var(--f);margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--line);padding:12px 16px;border-radius:10px;z-index:9;max-width:min(560px,calc(100vw - 32px));box-shadow:0 10px 30px rgba(0,0,0,.4)}
.mtabs{display:none}
.steps{padding-left:20px;display:grid;gap:8px;color:var(--ink)}
.steps li::marker{color:var(--accent)}
code{font-family:var(--mono);font-size:.85em;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
@media (max-width:1100px){.shell{grid-template-columns:200px 1fr}.preview{display:none}.shell.show-pv .editor{display:none}.shell.show-pv .preview{display:grid;border-left:0}.mtabs{display:inline-flex}}
@media (max-width:720px){
  body{overflow:auto}.app{height:auto;min-height:100%}
  .shell{grid-template-columns:1fr}
  .rail{display:flex;overflow-x:auto;padding:8px;gap:4px;border-right:0;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}
  .rail h6{display:none}.rail button{width:auto;white-space:nowrap}.rail button.on{box-shadow:inset 0 -3px 0 var(--accent)}
  .editor{overflow:visible}.shell.show-pv .preview{height:80vh}
  .img-field{grid-template-columns:72px 1fr}.thumb{width:72px;height:72px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo"><b>MAR</b>Site dashboard</div>
    <span class="pill" id="status">Loading…</span>
    <span class="spacer"></span>
    <span class="seg mtabs" role="group" aria-label="View"><button type="button" id="tabEdit" aria-pressed="true">Edit</button><button type="button" id="tabPv" aria-pressed="false">Preview</button></span>
    <a class="btn" id="liveLink" href="./" target="_blank" rel="noopener">View live site ↗</a>
    <button class="btn primary" id="publishBtn" type="button">Publish changes</button>
  </header>
  <div class="shell" id="shell">
    <nav class="rail" id="rail" aria-label="Sections"></nav>
    <main class="editor" id="editor"></main>
    <section class="preview" aria-label="Live preview">
      <div class="pv-bar"><span>Live preview</span><span class="spacer"></span>
        <span class="seg" role="group" aria-label="Device"><button type="button" id="pvDesk" aria-pressed="true">Desktop</button><button type="button" id="pvMob" aria-pressed="false">Phone</button></span>
      </div>
      <div class="pv-wrap" id="pvWrap"><iframe id="pv" title="Website preview"></iframe></div>
    </section>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<script src="render.js"></script>
<script>
(function(){
"use strict";

var DEFAULT_THEME={bg:"#081633",bg2:"#0D1F45",accent:"#4A86FF",highlight:"#F2C46D"};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);return true}catch(x){return false}}
function clone(o){return JSON.parse(JSON.stringify(o))}
function get(o,p){return p.split(".").reduce(function(x,k){return x==null?undefined:x[k]},o)}
function set(o,p,v){var ks=p.split("."),last=ks.pop(),t=ks.reduce(function(x,k){if(x[k]==null)x[k]={};return x[k]},o);t[last]=v}
function el(tag,attrs){var n=document.createElement(tag);attrs=attrs||{};for(var k in attrs){var v=attrs[k];if(v==null||v===false)continue;if(k==="text")n.textContent=v;else if(k==="html")n.innerHTML=v;else if(k.slice(0,2)==="on")n.addEventListener(k.slice(2),v);else if(k==="class")n.className=v;else n.setAttribute(k,v===true?"":v)}
  for(var i=2;i<arguments.length;i++){var c=arguments[i];if(c==null||c===false)continue;if(Array.isArray(c))c.forEach(function(x){if(x)n.appendChild(typeof x==="string"?document.createTextNode(x):x)});else n.appendChild(typeof c==="string"?document.createTextNode(c):c)}return n}

 {g:"Website",id:"seo",i:"G",title:"SEO & Google",desc:"How your homepage appears in Google, AI answers and when shared on LinkedIn or WhatsApp.",fields:[

   {k:"nav",t:"list",label:"Menu buttons",add:"Add button",sum:function(x){return x.label+"  →  "+x.href},tpl:{label:"New",href:"#"},fields:[{row:[{k:"label",t:"text",label:"Button text"},{k:"href",t:"text",label:"Goes to"}]}]},
   {k:"hero.navButton",t:"text",label:"Highlighted button (right side)",help:"Links to your Contact section. Leave empty to hide."}]},
 {g:"Website",id:"layout",i:"≡",title:"Homepage sections",desc:"Drag sections to change their order on the homepage. Untick to hide one.",fields:[{k:"sections",t:"sections"}]},
 {g:"Website",id:"theme",i:"◐",title:"Colours",desc:"Your brand colours. The site is designed around a dark blue base.",fields:[
   {k:"theme.bg",t:"color",label:"Page background"},{k:"theme.bg2",t:"color",label:"Raised section background"},
   {k:"theme.accent",t:"color",label:"Accent (buttons, links)"},{k:"theme.highlight",t:"color",label:"Highlight (results numbers)"}],after:function(box){box.appendChild(el("button",{class:"btn small",type:"button",onclick:function(){C.theme=clone(DEFAULT_THEME);changed();renderPanel()}},"Reset to default colours"))}},

   {k:"profile.jobTitle",t:"text",label:"Job title"},

 {g:"Homepage",id:"hero",i:"H",title:"Top of page",desc:"The first thing visitors see.",fields:[

   {row:[{k:"hero.photoCaptionLeft",t:"text",label:"Photo caption left"},{k:"hero.photoCaptionRight",t:"text",label:"Photo caption right"}]},

 {g:"Homepage",id:"about",i:"A",title:"About me",desc:"Keep the first paragraph as a direct answer to “Who is Muhammad Awais Rustam?”. Google and AI assistants quote it.",fields:[
   {row:[{k:"about.eyebrow",t:"text",label:"Small label"},{k:"about.heading",t:"text",label:"Heading"}]},
   {k:"about.paragraphs",t:"strings",label:"Paragraphs",multi:true,add:"Add paragraph"},
   {k:"about.facts",t:"list",label:"Quick facts",sum:function(x){return x.label+": "+x.value},tpl:{label:"Label",value:""},fields:[{row:[{k:"label",t:"text",label:"Label"},{k:"value",t:"text",label:"Value"}]}]}]},
 {g:"Homepage",id:"projects",i:"R",title:"Projects",fields:[

     {k:"paragraphs",t:"strings",label:"Story",multi:true,add:"Add paragraph"},

     {k:"tags",t:"strings",label:"Tags",add:"Add tag"},
     {group:"Budget split bar (optional)",fields:[{row:[{k:"splitLabelA",t:"text",label:"Part A label"},{k:"splitPctA",t:"number",label:"Part A %",help:"0 hides the bar"}]},{k:"splitLabelB",t:"text",label:"Part B label"},{k:"splitNote",t:"text",label:"Note under bar"}]}]}]},
 {g:"Homepage",id:"skills",i:"S",title:"Skills",fields:[
